services:
  iot-api:
    image: iot-api:latest
    build:
      context: ../../api/iot
      dockerfile: Dockerfile
    container_name: iot-api
    ports:
      - "888:8080"
    volumes:
      - iot-data:/app/data
      - iot-logs:/app/logs
      - ${IOT_NETWORK_SCAN_FILE:-./network_scan.json}:/app/ipt/network_scan.json:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      IOT_SEED_TEST_DATA: "false"
      IOT_SECURITY_SEED_ADMIN: "true"
      IOT_DEVICE_IP_SCAN_ENABLED: "true"
      IOT_DEVICE_IP_SCAN_FILE_PATH: /app/ipt/network_scan.json
      IOT_DEVICE_IP_SCAN_INTERVAL_MS: "600000"
    restart: unless-stopped

  iot-font:
    image: iot-font:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-font
    ports:
      - "8080:80"
    depends_on:
      - iot-api
    restart: unless-stopped

volumes:
  iot-data:
  iot-logs:
