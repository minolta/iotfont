<div class="app-shell">
  <header class="app-header">
    <a routerLink="/devices" class="brand">IoT Admin</a>
    <nav class="app-nav">
      <div class="nav-group">
        <a
          routerLink="/devices"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-group-label"
          >Devices</a
        >
        <div class="nav-group-menu">
          <a
            routerLink="/devices"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >All devices</a
          >
          <a routerLink="/devices/new" routerLinkActive="active">Add device</a>
          <a routerLink="/devices/import" routerLinkActive="active">Import devices</a>
          <a routerLink="/devices/info" routerLinkActive="active">Live info</a>
        </div>
      </div>
      <div class="nav-group">
        <a
          routerLink="/jobs"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-group-label"
          >Jobs</a
        >
        <div class="nav-group-menu">
          <a
            routerLink="/jobs"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            >All jobs</a
          >
          <a routerLink="/jobs/new" routerLinkActive="active">Add job</a>
          <a routerLink="/jobs/import" routerLinkActive="active">Import jobs</a>
          <a
            routerLink="/job-types"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            >All job types</a
          >
          <a routerLink="/job-types/new" routerLinkActive="active">Add job type</a>
          <a
            routerLink="/job-groups"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            >All job groups</a
          >
          <a routerLink="/job-groups/new" routerLinkActive="active">Add job group</a>
        </div>
      </div>
      <a routerLink="/tasks" routerLinkActive="active">Tasks</a>
    </nav>
  </header>
  <main class="app-main">
    <router-outlet />
  </main>
</div>
