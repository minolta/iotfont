<section class="subsection" aria-labelledby="job-ports-heading">
  <div class="subsection-header">
    <div class="subsection-title-wrap">
      <h2 id="job-ports-heading">
        GPIO ports
        <span class="subsection-badge">{{ ports().length }}</span>
      </h2>
      <p class="subsection-hint">Optional port actions run on target devices when this job executes.</p>
    </div>
    <button type="button" class="secondary-btn" [disabled]="disabled()" (click)="addPort.emit()">
      + Add port
    </button>
  </div>

  @if (ports().length === 0) {
    <p class="subsection-empty">No ports configured. Click “Add port” to control GPIO outputs.</p>
  } @else {
    <div class="subsection-list">
      @for (portGroup of ports().controls; track $index) {
        <div class="subsection-card" [formGroup]="$any(portGroup)">
          <div class="subsection-card-header">
            <span class="subsection-card-label">Port {{ $index + 1 }}</span>
            <button type="button" class="remove-btn" [disabled]="disabled()" (click)="removePort($index)">
              Remove
            </button>
          </div>

          <div class="subsection-grid">
            <div class="field">
              <label [for]="'port-device-' + $index">Target device</label>
              <select [id]="'port-device-' + $index" formControlName="deviceId" [disabled]="disabled()">
                <option value="">Select device…</option>
                @for (device of devices(); track device.id) {
                  <option [value]="device.id">
                    #{{ device.id }} — {{ device.name?.trim() || device.code?.trim() || 'Device' }}
                  </option>
                }
              </select>
            </div>

            <div class="field">
              <label [for]="'port-name-' + $index">GPIO port</label>
              <select [id]="'port-name-' + $index" formControlName="port" [disabled]="disabled()">
                @for (option of portOptions; track option) {
                  <option [value]="option">{{ option }}</option>
                }
              </select>
            </div>

            <div class="field">
              <label [for]="'port-logic-' + $index">Logic</label>
              <select [id]="'port-logic-' + $index" formControlName="logic" [disabled]="disabled()">
                @for (option of logicOptions; track option) {
                  <option [value]="option">{{ option }}</option>
                }
              </select>
            </div>

            <div class="field">
              <label [for]="'port-runtime-' + $index">Runtime (s)</label>
              <input
                [id]="'port-runtime-' + $index"
                type="number"
                formControlName="runtime"
                min="0"
                step="1"
                [readonly]="disabled()"
              />
            </div>

            <div class="field">
              <label [for]="'port-waittime-' + $index">Wait time (s)</label>
              <input
                [id]="'port-waittime-' + $index"
                type="number"
                formControlName="waittime"
                min="0"
                step="1"
                [readonly]="disabled()"
              />
            </div>

            <div class="field checkbox-field">
              <input [id]="'port-enable-' + $index" type="checkbox" formControlName="enable" [disabled]="disabled()" />
              <label [for]="'port-enable-' + $index">Enabled</label>
            </div>
          </div>
        </div>
      }
    </div>
  }
</section>
